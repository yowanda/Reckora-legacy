app = "reckora"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  RECKORA_CORS_ORIGINS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
