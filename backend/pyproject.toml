[project]
name = "reckora-backend"
version = "0.1.0"
description = "Reckora username footprint scanner — backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # http2 saves ~1 RTT on warm pools; brotli unlocks responses from CDNs
    # that only send `br` when the client advertises it (most modern WAFs).
    "httpx[http2,brotli,socks]>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "slowapi>=0.1.9",
    "orjson>=3.10.0",
    "anyio>=4.4.0",
    # Auto-deploy environments often resolve the `fastapi[standard]` extra
    # incorrectly, leaving the `fastapi` CLI broken. Pull these in
    # explicitly so the container can start with `fastapi run`.
    "typer>=0.12.0",
    "rich-toolkit>=0.11.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.7",
    "email-validator>=2.0.0",
    "curl-cffi>=0.7.0",
    # Phase 3: profile-identity extraction from CLAIMED page bodies.
    "socid-extractor>=0.0.28",
    # Phase 4: lightweight ML classifier (LogisticRegression exported to
    # ONNX at training time, evaluated at runtime via onnxruntime). The
    # repo ships the pre-trained model as a binary asset so the runtime
    # never needs scikit-learn — only training does.
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0",
    # Phase 7a: perceptual-hash graph stitching. Pillow is the only
    # external image dep; the actual hash (8x8 dHash variant) is
    # implemented in-module so we don't drag in scipy / PyWavelets via
    # the larger ``imagehash`` package — the gain on a default-off
    # admin knob isn't worth the ~30 MB Docker bloat. See
    # ``app.imagephash`` for the algorithm and rationale.
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # Phase 4: ML training only. Not installed in the production runtime.
    "scikit-learn>=1.4.0",
    "skl2onnx>=1.17.0",
]
# Phase 6d: server-side PDF export via weasyprint.
pdf = ["weasyprint>=62.0"]
# Phase 8a: distributed worker fleet (Celery + Redis broker / result backend).
# Opt-in via env var ``RECKORA_USE_CELERY=1``; without it the runtime keeps
# the in-process asyncio fan-out so HF Space's single-container deployment
# does not require a separate broker. Pinning ``celery>=5.4`` for the
# improved type hints + ``redis>=5.0`` for the async client.
scale = ["celery>=5.4.0", "redis>=5.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/data/sites.json" = "app/data/sites.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "ARG001", "RUF100"]
# Training scripts use sklearn convention (X for matrix, y for target)
# and lazily import the local app package after a sys.path tweak.
"scripts/train_ml.py" = ["E402", "F841", "N806"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
# Bundled deps without type stubs (curl_cffi, socid_extractor, onnxruntime,
# slowapi). Their surface in our code is small and well-covered by tests,
# so skipping their stub validation keeps the gate honest without blocking
# on third-party type debt.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Per-module strictness will graduate over time. For now we gate on the
# zero-error baseline established in this commit; tightening to --strict
# lives in a follow-up phase once the existing modules are annotated.
check_untyped_defs = true
