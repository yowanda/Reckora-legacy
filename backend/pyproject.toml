[project]
name = "reckora-backend"
version = "0.1.0"
description = "Reckora username footprint scanner — backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # http2 saves ~1 RTT on warm pools; brotli unlocks responses from CDNs
    # that only send `br` when the client advertises it (most modern WAFs).
    "httpx[http2,brotli]>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "slowapi>=0.1.9",
    "orjson>=3.10.0",
    "anyio>=4.4.0",
    # Auto-deploy environments often resolve the `fastapi[standard]` extra
    # incorrectly, leaving the `fastapi` CLI broken. Pull these in
    # explicitly so the container can start with `fastapi run`.
    "typer>=0.12.0",
    "rich-toolkit>=0.11.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.7",
    "email-validator>=2.0.0",
    "curl-cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/data/sites.json" = "app/data/sites.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "ARG001", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
